[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "navigation-control-flight-simulation"
version = "0.1.0"
description = "Energy-consistent guidance and constrained MPC for altitude gates, flown in FlightGear over Munich"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]
flightgear = ["flightgear-python"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
